services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vyapar
      POSTGRES_PASSWORD: vyapar
      POSTGRES_DB: vyapar
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapar -d vyapar"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
